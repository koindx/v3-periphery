# CI of the koindx/v3-periphery repository (GitHub only runs workflows at the root of a repository:
# it is inactive while this folder lives in the KoinDX v3 monorepo)
name: CI

on: [push, pull_request]

jobs:
  build:
    name: Lint, unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - run: yarn --frozen-lockfile
      - run: yarn lint
      - run: yarn test
      - run: yarn build:release --network local

  core:
    # the code shared with v3-core and the v3-core contracts of the unit tests (tests/core) must
    # match the current koindx/v3-core
    name: Matches koindx/v3-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: v3-periphery
      - uses: actions/checkout@v4
        with:
          repository: koindx/v3-core
          path: v3-core
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Shared code is identical to v3-core
        run: node v3-periphery/scripts/check-shared.js v3-core
      - name: Build v3-core
        working-directory: v3-core
        run: yarn --frozen-lockfile && yarn build:release
      - name: tests/core holds the v3-core builds
        working-directory: v3-periphery
        run: node scripts/sync-core.js ../v3-core && git diff --exit-code -- tests/core
